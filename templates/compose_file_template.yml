services:
  {% macro postgres_container(subject, postgres_host_name, exporter_name, port=5432, metrics_path='/metrics', extra_host=None) -%}
  {{ exporter_name }}:
    container_name: {{ exporter_name }}
    image: prometheuscommunity/postgres-exporter:v0.20.1
    {% if extra_host -%}
    extra_hosts:
      - {{ extra_host}}
    {% endif -%}
    environment:
      - DATA_SOURCE_URI={{ postgres_host_name }}:{{ port }}/rutherford
      - DATA_SOURCE_USER=$POSTGRES_DB_USER
      - DATA_SOURCE_PASS=${{subject.upper()}}_POSTGRES_PASSWORD
  {% endmacro -%}

  # Postgres
  {%- if postgres_containers -%}
  {%- for subject, subject_containers in postgres_containers.items() %}
  # {{ subject.upper() }}
  {%- for postgres_environment, container in subject_containers.items() %}
  {{ postgres_container(subject, postgres_host_name=container.name, exporter_name='prom-' + container.exporter_name) }}
  {%- endfor %}
  {%- endfor %}
  {%- endif %}

  {% macro elasticsearch_container(subject, exporter_name) -%}
  {{ exporter_name }}:
    container_name: {{ exporter_name }}
    image: prometheuscommunity/elasticsearch-exporter:v1.7.0
    extra_hosts:
      - elasticsearch:$LOCAL_{{subject.upper()}}_ELASTICSEARCH_V9_IP
    command:
      - '--es.uri=http://elastic:${{subject.upper()}}_ELASTIC_PASSWORD@elasticsearch:9200'
  {% endmacro -%}

  # Elasticsearch
  {%- if elasticsearch_containers -%}
  {%- for subject, subject_containers in elasticsearch_containers.items() %}
  # {{ subject.upper() }}
  {%- for elasticsearch_environment, container in subject_containers.items() %}
  {%- if elasticsearch_environment is equalto 'live' %}
  {{ elasticsearch_container(subject, exporter_name='prom-' + container.exporter_name) }}
  {%- else %}
  {{ elasticsearch_container(exporter_name=container.exporter_name) }}
  {%- endif %}
  {%- endfor %}
  {%- endfor %}
  {%- endif %}

  # Nginx
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: prom-isaac-router-exporter
    command:
      - '--nginx.scrape-uri=http://isaac-router:8080/nginx-status-page'
      - '--web.listen-address=:9113'

  # Metrics Collating and Querying
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    command:
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.path=/prometheus/data
      - --config.file=/etc/prometheus/prometheus.yaml
    volumes:
      - ./{{prometheus_config_path}}:/etc/prometheus/prometheus.yaml
      - prometheus-storage:/prometheus/data

  grafana:
    container_name: grafana
    image: grafana/grafana
    environment:
      - GF_SERVER_DOMAIN=monitor.isaacphysics.org
      - GF_SERVER_ROOT_URL=https://%(domain)s/
      - GF_SECURITY_ADMIN_USER=$GRAFANA_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
      - GF_DATABASE_TYPE=sqlite3
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=$LOCAL_SMTP:25
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=monitor@isaacphysics.org
      - GF_SMTP_FROM_NAME=Isaac Monitor
    volumes:
      - grafana-storage:/var/lib/grafana


networks:
  default:
    name: isaac
    external: true
volumes:
  prometheus-storage:
    external: true
  grafana-storage:
    external: true
